name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: claimcheck
          POSTGRES_PASSWORD: claimcheck
          POSTGRES_DB: claimcheck_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimcheck" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      # fully offline: synthetic data, pattern extractor, offline agent planner, mock CMS in-process
      - name: pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://claimcheck:claimcheck@localhost:5432/claimcheck_test' || '' }}
        run: python -m pytest -q
